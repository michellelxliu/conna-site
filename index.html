<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Conna is an early-stage platform for simulating societies of LLM agents and branching counterfactual worlds."
    />
    <meta property="og:title" content="Conna — Simulate societies. Branch worlds." />
    <meta
      property="og:description"
      content="An experimental platform for studying collective behavior in societies of LLM agents."
    />
    <meta property="og:type" content="website" />
    <title>Conna — Simulate societies. Branch worlds.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    />

  <body>
    <header>
      <span class="brand">conna<span>.</span></span>
      <span class="status"><i></i> In private development</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="copy">
          <p class="eyebrow">LLM agent society simulation</p>
          <h1 id="hero-title">Simulate societies.<br />Branch worlds.</h1>

            outcomes unfold across counterfactual worlds.
          </p>

        <div class="constellation" aria-hidden="true">
          <span class="orbit orbit-one"></span>
          <span class="orbit orbit-two"></span>
          <span class="line line-one"></span>
          <span class="line line-two"></span>
          <span class="line line-three"></span>
          <span class="node node-one"></span>
          <span class="node node-two"></span>
          <span class="node node-three"></span>
          <span class="node node-four"></span>
          <span class="node node-five"></span>
          <span class="node node-six"></span>
        </div>
      </section>
